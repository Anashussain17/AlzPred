{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning">
                <h3 class="text-center mb-0">MRI Scan Analysis</h3>
            </div>
            <div class="card-body text-center">
                <div class="upload-container p-5 border rounded bg-light">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-4">
                            <input type="file" class="form-control" name="mri" 
                                   id="mriUpload" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-cloud-upload"></i> Analyze MRI
                        </button>
                        <p class="text-muted mt-3">
                            Supported formats: JPG, PNG<br>
                            Max file size: 5MB
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
