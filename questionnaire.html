{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-info text-white">
            <h2 class="text-center">Cognitive Assessment</h2>
            <p class="text-center mb-0">Please answer these 10 questions honestly</p>
        </div>
        <div class="card-body">
            <form method="POST">
                {% for question in questions %}
                <div class="question-card mb-4 p-3 rounded shadow-sm">
                    <p class="h5 mb-3">{{ question.text }}</p>
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="q{{ question.id }}" 
                               id="q{{ question.id }}_yes" value="yes" required>
                        <label class="btn btn-outline-success" for="q{{ question.id }}_yes">Yes</label>

                        <input type="radio" class="btn-check" name="q{{ question.id }}" 
                               id="q{{ question.id }}_no" value="no" required>
                        <label class="btn btn-outline-danger" for="q{{ question.id }}_no">No</label>
                    </div>
                </div>
                {% endfor %}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Submit Answers</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
